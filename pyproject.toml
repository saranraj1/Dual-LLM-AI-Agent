[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-llm-ai-agent"
version = "1.0.0"
description = "Autonomous coding assistant with dual LLM backend (Ollama local + Groq cloud)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Saranraj" }
]
keywords = ["ai", "agent", "llm", "ollama", "groq", "coding-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "requests>=2.31.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
all = [
    "sentence-transformers>=2.2.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# After `pip install -e .`, type `ai` from any folder to start the agent
ai = "main:main"

[project.urls]
Homepage = "https://github.com/saranraj1/Dual-LLM-AI-Agent"
Repository = "https://github.com/saranraj1/Dual-LLM-AI-Agent"
Issues = "https://github.com/saranraj1/Dual-LLM-AI-Agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "core*", "tools*", "memory*", "config*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.flake8]
max-line-length = 120
exclude = [
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    ".git",
]
extend-ignore = ["E501", "W503"]

[tool.black]
line-length = 120
target-version = ["py311", "py312"]
